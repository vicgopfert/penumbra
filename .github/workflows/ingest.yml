name: Ingestão

# Ingestão no banco de produção (B-14), toda noite e também à mão (B-54). No fim, recarrega o
# índice da API e revalida o cache das páginas públicas na Vercel (B-102).
# O modo sonda-steam (B-78) só confere, de qualquer branch, se a rota de etiquetas da Steam
# responde ao Actions, numa amostra do catálogo, sem gravar nada. O modo teste-alerta (B-54)
# falha de propósito, de qualquer branch e sem tocar no banco, para ensaiar o alerta.
on:
  schedule:
    # 03:23 em Brasília (UTC−3, sem horário de verão), fora da virada da hora, quando o GitHub
    # mais atrasa as execuções agendadas.
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: ingestao grava o catálogo; sonda-steam só lê; teste-alerta só ensaia o alerta
        type: choice
        options:
          - ingestao
          - sonda-steam
          - teste-alerta
        default: ingestao

permissions:
  contents: read

# Mesmo grupo do job de migrations: os dois nunca mexem no banco de produção ao mesmo tempo, e
# nenhuma execução é cancelada no meio.
concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingestão do catálogo no banco de produção
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.modo == 'ingestao')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Conexão direta do Neon, não a do pooler: a gravação é uma transação longa.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalação
        run: pnpm install --frozen-lockfile

      - name: Build da API
        run: pnpm --filter @indie/api run build

      - name: Ingestão
        run: pnpm --filter @indie/api run ingest

      # Direto no Render, sem passar pela Vercel. Se a API estiver hibernando, a chamada a acorda
      # (cerca de um minuto), e a recarga só repete a carga da inicialização.
      - name: Recarga do índice de conteúdo
        env:
          API_URL: ${{ vars.API_URL }}
          INTERNAL_RELOAD_SECRET: ${{ secrets.INTERNAL_RELOAD_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$INTERNAL_RELOAD_SECRET" ]; then
            echo "::error::Configure a variável API_URL e o segredo INTERNAL_RELOAD_SECRET do repositório."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $INTERNAL_RELOAD_SECRET" \
            "$API_URL/api/internal/reload-index")"
          echo "$response"
          { echo '## Índice de conteúdo'; echo '```'; echo "$response"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # O cache de dados das páginas públicas na Vercel (B-102): marca como velhos os jogos, as
      # coleções e o catálogo, e o próximo visitante recebe o dado anterior enquanto o novo é buscado.
      # Sem o segredo, a execução falha, como na recarga; uma falha da chamada só gera aviso, porque
      # o cache volta sozinho em até um dia.
      - name: Revalidação das páginas públicas
        env:
          WEB_URL: https://penumbraindie.com.br
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::Configure o segredo REVALIDATE_SECRET do repositório."
            exit 1
          fi
          if response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" \
            "$WEB_URL/internal/revalidate" 2>&1)"; then
            echo "$response"
            { echo '## Revalidação das páginas públicas'; echo '```'; echo "$response"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Revalidação das páginas::$response"
            { echo '## Revalidação das páginas públicas'; echo "Falhou: $response"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resumo da execução
        if: always()
        run: |
          # O psql não aceita o parâmetro schema que o Prisma usa na URL e, com sslmode=verify-*,
          # procura um certificado raiz próprio que o executor não tem: usa os do sistema.
          export PSQL_URL="$(node -e "
            const u = new URL(process.env.DATABASE_URL);
            u.searchParams.delete('schema');
            if (u.searchParams.get('sslmode')?.startsWith('verify')) u.searchParams.set('sslrootcert', 'system');
            console.log(u.toString());
          ")"
          {
            echo '## Última execução'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT status, \"startedAt\", \"finishedAt\" - \"startedAt\" AS duracao,
                \"gamesFetched\" AS buscados, \"gamesUpserted\" AS catalogo,
                \"gamesInvalid\" AS fora_do_schema, \"gamesDeactivated\" AS desativados,
                \"flagsRaised\" AS alertas, \"popularityMax\" AS pop_max,
                \"popularityMedian\" AS pop_mediana, left(\"errorSummary\", 300) AS erro
              FROM \"IngestionRun\" ORDER BY \"startedAt\" DESC LIMIT 1"
            echo '```'
            echo '## Catálogo'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT CASE
                WHEN \"releaseStatus\" = 'UPCOMING' AND \"firstReleaseDate\" IS NOT NULL THEN 'por lançar, com data'
                WHEN \"releaseStatus\" = 'UPCOMING' THEN 'por lançar, sem data'
                ELSE 'lançado' END AS grupo, count(*) AS jogos
              FROM \"Game\" WHERE \"inCatalog\" GROUP BY 1 ORDER BY 1"
            echo '```'
            echo '## País do estúdio'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT coalesce(\"studioCountrySource\"::text, 'não informado') AS origem,
                count(*) AS jogos, round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS percentual
              FROM \"Game\" WHERE \"inCatalog\" GROUP BY 1 ORDER BY 2 DESC"
            echo '```'
            echo '## Etiquetas'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT coalesce(\"tagSource\"::text, 'sem etiqueta') AS origem,
                count(*) AS jogos, round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS percentual
              FROM \"Game\" WHERE \"inCatalog\" GROUP BY 1 ORDER BY 2 DESC"
            echo '```'
            echo '## Coleções'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT c.slug, count(g.id) FILTER (WHERE g.\"inCatalog\") AS no_catalogo,
                count(g.id) FILTER (WHERE NOT g.\"inCatalog\") AS fora
              FROM \"Collection\" c
              LEFT JOIN \"CollectionGame\" cg ON cg.\"collectionId\" = c.id
              LEFT JOIN \"Game\" g ON g.id = cg.\"gameId\"
              GROUP BY c.slug, c.\"sortOrder\" ORDER BY c.\"sortOrder\""
            echo '```'
            echo '## Alertas da execução'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT f.kind, f.\"gameName\", f.detail
              FROM \"IngestionReviewFlag\" f
              WHERE f.\"runId\" = (SELECT id FROM \"IngestionRun\" ORDER BY \"startedAt\" DESC LIMIT 1)
                AND f.kind <> 'RELEASE_STATUS_CHANGED'
              ORDER BY f.kind, f.\"gameName\" LIMIT 100"
            echo '```'
            echo '## Tamanho do banco'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT pg_size_pretty(pg_database_size(current_database())) AS banco"
            psql "$PSQL_URL" -X -q -c "
              SELECT relname AS tabela, pg_size_pretty(pg_total_relation_size(relid)) AS tamanho,
                n_live_tup AS vivas, n_dead_tup AS mortas
              FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 8"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Também no log da execução, para a cobertura ser lida sem abrir o resumo (B-84).
          {
            echo '## Plataformas e lojas'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT CASE WHEN \"releaseStatus\" = 'UPCOMING' THEN 'por lançar' ELSE 'lançado' END AS grupo,
                count(*) AS jogos,
                count(*) FILTER (WHERE EXISTS (
                  SELECT 1 FROM \"GamePlatform\" gp WHERE gp.\"gameId\" = g.id)) AS com_plataforma,
                round(100.0 * count(*) FILTER (WHERE EXISTS (
                  SELECT 1 FROM \"GamePlatform\" gp WHERE gp.\"gameId\" = g.id)) / count(*), 1) AS percentual
              FROM \"Game\" g WHERE g.\"inCatalog\" GROUP BY 1 ORDER BY 1"
            psql "$PSQL_URL" -X -q -c "
              SELECT sl.store AS loja, count(*) AS jogos_com_link,
                round(100.0 * count(*) / (SELECT count(*) FROM \"Game\" WHERE \"inCatalog\"), 1) AS percentual_do_catalogo
              FROM \"GameStoreLink\" sl JOIN \"Game\" g ON g.id = sl.\"gameId\"
              WHERE g.\"inCatalog\" GROUP BY sl.store ORDER BY sl.store"
            echo '```'
            # Só os jogos que estavam no catálogo e continuam nele (B-54).
            echo '## Situação de lançamento'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT CASE f.detail->>'to' WHEN 'RELEASED' THEN 'Em breve → lançado'
                ELSE 'lançado → Em breve' END AS passagem,
                f.\"gameName\" AS jogo, f.detail->>'releaseDate' AS data
              FROM \"IngestionReviewFlag\" f
              WHERE f.\"runId\" = (SELECT id FROM \"IngestionRun\" ORDER BY \"startedAt\" DESC LIMIT 1)
                AND f.kind = 'RELEASE_STATUS_CHANGED'
              ORDER BY 1, 3, 2 LIMIT 200"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Execução gravada com alguma fonte fora do ar ou com a desativação pulada: o catálogo foi
          # gravado com o que já estava, então só avisa, sem abrir alerta (B-54).
          degraded="$(psql "$PSQL_URL" -X -q -t -A -c "
            SELECT left(\"errorSummary\", 300) FROM \"IngestionRun\"
            WHERE id = (SELECT id FROM \"IngestionRun\" ORDER BY \"startedAt\" DESC LIMIT 1)
              AND status = 'SUCCEEDED' AND \"errorSummary\" IS NOT NULL" | tr '\n' ' ')"
          if [ -n "$degraded" ]; then
            echo "::warning title=Ingestão com ressalvas::$degraded"
          fi

  # Falha da ingestão, ou cancelamento da agendada (tempo limite, fila do grupo de concorrência),
  # abre uma issue, ou comenta na que já está aberta; cancelar à mão não abre. A próxima execução
  # bem-sucedida fecha as abertas. O e-mail do próprio GitHub sobre a falha vem junto.
  alert:
    name: Alerta da ingestão
    needs: [ingest, alert-drill]
    if: always() && (needs.ingest.result != 'skipped' || needs.alert-drill.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INGEST_RESULT: ${{ needs.ingest.result }}
      DRILL_RESULT: ${{ needs.alert-drill.result }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Issue de alerta
        run: |
          open_issues() {
            gh issue list --label ingestao --state open --json number,title --jq "$1"
          }
          if [ "$INGEST_RESULT" = success ]; then
            for number in $(open_issues '.[].number'); do
              gh issue close "$number" --comment "Resolvida pela execução bem-sucedida $RUN_URL."
            done
            exit 0
          fi
          case "$INGEST_RESULT/$DRILL_RESULT/$EVENT" in
            failure/*/* | cancelled/*/schedule)
              title='A ingestão do catálogo falhou'; result="$INGEST_RESULT" ;;
            */failure/*) title='[teste] A ingestão do catálogo falhou'; result='falha de propósito' ;;
            *) exit 0 ;;
          esac
          [ "$EVENT" = schedule ] && origin='agendada' || origin='manual'
          gh label create ingestao --color B60205 --force \
            --description 'Falha da ingestão no banco de produção'
          number="$(open_issues "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Nova execução $origin com resultado \`$result\`: $RUN_URL"
          else
            gh issue create --title "$title" --label ingestao --body "$(printf '%s\n\n%s\n\n%s' \
              "A execução $origin $RUN_URL terminou com resultado \`$result\`." \
              'O resumo da execução traz o registro do `IngestionRun`, com o resumo do erro. Enquanto a falha durar, o catálogo fica como estava na última execução bem-sucedida.' \
              'Esta issue fecha sozinha na próxima execução bem-sucedida; uma nova falha antes disso entra como comentário.')"
          fi

  alert-drill:
    name: Ensaio do alerta (falha de propósito)
    if: inputs.modo == 'teste-alerta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Falha
        run: |
          echo "::error::Falha de propósito, para ensaiar o alerta da ingestão (B-54)."
          exit 1

  steam-probe:
    name: Sonda da Steam (só leitura)
    if: inputs.modo == 'sonda-steam'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Só lê o catálogo gravado, para escolher a amostra: nada é gravado no banco.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalação
        run: pnpm install --frozen-lockfile

      - name: Build da API
        run: pnpm --filter @indie/api run build

      # Com pipefail (shell bash), a falha da sonda falha o passo mesmo passando pelo tee.
      - name: Sonda
        shell: bash
        working-directory: apps/api
        run: node dist/probe-steam.js --games 200 | tee -a "$GITHUB_STEP_SUMMARY"
